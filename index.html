function lcn(q){return q.nm.indexOf("DDM")===0?q.nm:q.nm.toLowerCase()}
function des(v){for(var k in DES){if(v.n.indexOf(k)===0)return DES[k]}return []}
var OP={},PH={};
function dsx(x,id){x.ds=x.ds||{};return x.ds[id]||(x.ds[id]={d:null,g:0})}
function incOn(x){return !!(x.fn||x.ag||x.ar||x.ot)}
function dsFalta(v,x){var f=0;des(v).forEach(function(q){var z=dsx(x,q.id);if(z.d===null)f++;if(!z.g)f++});return f}
function idb(){return new Promise(function(res){try{var r=indexedDB.open("vados_fotos",1);r.onupgradeneeded=function(){r.result.createObjectStore("f")};r.onsuccess=function(){res(r.result)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function phSave(){PH.__rev=S.rev?S.rev.fecha+" "+S.rev.ini:"";idb().then(function(db){if(!db)return;try{db.transaction("f","readwrite").objectStore("f").put(PH,"ph")}catch(e){}})}
function phLoad(cb){idb().then(function(db){if(!db){cb();return}try{var q=db.transaction("f").objectStore("f").get("ph");q.onsuccess=function(){var r=q.result;if(r&&S.rev&&r.__rev===S.rev.fecha+" "+S.rev.ini)PH=r;cb()};q.onerror=function(){cb()}}catch(e){cb()}})}
function foto(i,el){var f=el.files&&el.files[0];if(!f)return;var n=S.cfg.vados[i].n;PH[n]=PH[n]||[];if(PH[n].length>=2){el.value="";return}
  var u=URL.createObjectURL(f),im=new Image();im.onload=function(){var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);PH[n].push(c.toDataURL("image/jpeg",0.65));URL.revokeObjectURL(u);phSave();draw()};im.onerror=function(){URL.revokeObjectURL(u)};im.src=u;el.value=""}
function fotoDel(i,k){var n=S.cfg.vados[i].n;(PH[n]||[]).splice(k,1);phSave();draw()}
function dsD(i,id,b){var x=S.rev.d[S.cfg.vados[i].n],z=dsx(x,id);z.d=b;sv();draw()}
function dsG(i,id,v){var x=S.rev.d[S.cfg.vados[i].n],z=dsx(x,id);z.g=(z.g===v)?0:v;sv();draw()}
function tg(i,k){var x=S.rev.d[S.cfg.vados[i].n];x[k]=x[k]?0:1;if(k==="ot"&&x.ot)x.ot=" ";if(k==="ot"&&!x.ot)x.ot="";sv();draw()}

function desHTML(i,v,x){var it=des(v);if(!it.length)return '';var fa=dsFalta(v,x),id="dd"+i;
  var h='<details id="'+id+'" style="margin-top:10px"'+(OP[id]?' open':'')+' ontoggle="OP[this.id]=this.open"><summary style="font-weight:600;color:#1f4e6b;padding:6px 0">🧴 Desinfectante de manos'+(fa?' <span class="fal">faltan '+fa+'</span>':'')+'</summary>';
  it.forEach(function(q){var z=dsx(x,q.id);
    h+='<div style="margin-top:8px;padding:10px;border-radius:12px;background:#f1f5f9"><div style="font-weight:600;font-size:15px">'+esc(q.nm)+'</div>'+
    '<label>¿Dosifica?</label><div class="row"><button class="'+(z.d===true?"sel-si":"sec")+'" onclick="dsD('+i+',\''+q.id+'\',true)">Sí</button><button class="'+(z.d===false?"sel-no":"sec")+'" onclick="dsD('+i+',\''+q.id+'\',false)">No</button></div>'+
    '<div class="f"><span>Garrafa</span>'+[[1,"Llena","v"],[2,"Media","n"],[3,"Vacía","x"]].map(function(b){return '<button class="p'+(z.g===b[0]?' '+b[2]:'')+'" onclick="dsG('+i+',\''+q.id+'\','+b[0]+')">'+b[1]+'</button>'}).join('')+'</div></div>'});
  return h+'</details>'}
function incHTML(i,v,x){var id="di"+i,ph=PH[v.n]||[],t=(x.ot||"").trim(),c=(t?1:0)+((x.sap||"")?1:0);
  var h='<details id="'+id+'" style="margin-top:10px"'+(OP[id]||(c||ph.length)&&OP[id]!==false?' open':'')+' ontoggle="OP[this.id]=this.open"><summary style="font-weight:600;color:#9a3412;padding:6px 0">⚠️ Incidencias y foto'+(t||ph.length||x.sap?' <span class="fal">'+(t?'incidencia':'')+(x.sap?(t?' · ':'')+'SAP '+esc(x.sap):'')+(ph.length?((t||x.sap)?' · ':'')+ph.length+' foto'+(ph.length>1?'s':''):'')+'</span>':'')+'</summary>'+

  '<label>Nº de aviso SAP (solo para registro en el informe)</label><input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Nº de aviso (solo números)" value="'+esc(x.sap||"")+'" oninput="sap('+i+',this)">'+
  '<div class="row" style="margin-top:8px">'+ph.map(function(d,k){return '<div style="position:relative"><img src="'+d+'" style="width:84px;height:84px;object-fit:cover;border-radius:10px"><button onclick="fotoDel('+i+','+k+')" style="position:absolute;top:2px;right:2px;padding:0;width:24px;height:24px;border-radius:12px;background:#b91c1c">✕</button></div>'}).join('')+
  (ph.length<2?'<label class="p" style="flex:none;display:flex;align-items:center;justify-content:center;width:84px;height:84px;margin:0;font-size:13px;padding:4px;border-radius:10px">📷 Añadir foto<input type="file" accept="image/*" hidden onchange="foto('+i+',this)"></label>':'')+'</div></details>';
  return h}
function incTxt(x){var a=[];if(x.ot&&x.ot.trim())a.push(x.ot.trim());if(x.sap)a.push("Aviso SAP "+x.sap);return a}
function hora(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function hoy(){var d=new Date();return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear()}
function pl(v){return S.cfg.pl[v.k||v.p]||{prod:"",uni:"",min:null,max:null}}
function nueva(){S.rev={ini:hora(),fecha:hoy(),fin:null,d:{}};S.cfg.vados.forEach(function(v){S.rev.d[v.n]={dos:null,con:"",nota:"",gar:0,vad:0,ri:0,rd:0}});PH={};phSave();sv();draw();LM();document.getElementById("res").classList.add("hide")}
function rango(v){var p=pl(v);return [v.min!=null?v.min:p.min,v.max!=null?v.max:p.max]}
function estado(v){var x=S.rev.d[v.n],r=rango(v);if(x.con===""||x.con==null)return null;var c=parseFloat(String(x.con).replace(",","."));if(isNaN(c))return null;if(r[0]==null&&r[1]==null)return "sin rango";if(r[0]!=null&&c<r[0])return "BAJA";if(r[1]!=null&&c>r[1])return "ALTA";return "OK"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){
  document.getElementById("fecha").textContent=S.rev?S.rev.fecha:hoy();

  var L=document.getElementById("lista");L.innerHTML="";
