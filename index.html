<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<title>Vados sanitarios</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,-apple-system,system-ui,sans-serif;background:#eef2f4;color:#1a1d21;padding:12px 12px 90px;font-size:17px}
h1{font-size:20px;margin:10px 0}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#1f4e6b;color:#fff}
button.sec{background:#e5e7eb;color:#111}
button.sel-si{background:#15803d;color:#fff}
button.sel-no{background:#b91c1c;color:#fff}
input,textarea{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:10px;width:100%}
input.n{width:110px}
label{font-size:14px;color:#475569;display:block;margin:6px 0 2px}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-weight:600;font-size:15px}
.ok{background:#dcfce7;color:#166534}.mal{background:#fee2e2;color:#991b1b}.nd{background:#e5e7eb;color:#475569}
.small{font-size:14px;color:#64748b}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 6px #0002;display:flex;gap:8px}
.bar button{flex:1}
.hide{display:none}
.f{display:flex;align-items:center;gap:6px;margin-top:8px}.f>span{width:62px;font-size:13px;color:#475569;flex:none}
.p{flex:1;padding:9px 2px;border-radius:10px;background:#e5e7eb;color:#111;text-align:center;font-size:13px}
.p.v{background:#15803d;color:#fff}.p.n{background:#e07b00;color:#fff}.p.x{background:#b91c1c;color:#fff}
.rod{flex:1;padding:8px 4px;border-radius:12px;background:#e5e7eb;color:#111;text-align:center;font-size:13px;line-height:1.25}
.rod.v{background:#15803d;color:#fff}.rod.x{background:#b91c1c;color:#fff}
.fal{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:600;font-size:13px;background:#fde8c8;color:#8a4b00;margin-left:4px}
.dlg{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.dlg>div{background:#fff;border-radius:18px;padding:18px;max-width:380px;width:100%}
.dlg.hide{display:none}
.flash{outline:3px solid #e07b00;outline-offset:2px}
.sep{height:1px;background:#e2e8f0;margin:12px 0 4px}
</style><script src="pdf-lib.min.js"></script></head><body>
<h1>Vados sanitarios</h1>
<div id="cfg" class="card hide">
  <b>Configuración</b>
  <div id="cfgPl"></div>
  <label>Vados (uno por línea)</label><textarea id="cVados" rows="8"></textarea>
  <p class="small">Rango propio de un vado: <i>Nombre | mín | máx</i></p>
  <div class="row"><button onclick="guardarCfg()">Guardar</button><button class="sec" onclick="verCfg(false)">Cerrar</button></div>
</div>
<div id="main">
  <div class="card row" style="justify-content:space-between">
    <div><div class="small">Inicio</div><b id="hIni">—</b></div>
    <div><div class="small">Fecha</div><b id="fecha"></b></div>
    <button class="sec" onclick="verCfg(true)">⚙️</button>
  </div>
  <div class="card"><label style="margin-top:0">Revisor</label><input id="revisor" placeholder="Nombre y apellidos" oninput="setRev(this.value)"></div>
  <div id="lista"></div>
  <div id="res" class="card hide"><b>Revisión terminada</b><div id="resTxt" class="small" style="margin:6px 0"></div><div id="pend" style="margin-bottom:8px"></div><button onclick="guardarPdf()">Guardar PDF</button><div id="pdfMsg" class="small" style="margin-top:8px"></div>
  <div id="limp" style="margin-top:14px"></div></div>
</div>
<div id="dlg" class="dlg hide"></div>
<div class="bar"><button class="sec" onclick="nueva()">Nueva</button><button onclick="fin()">Fin de revisión</button></div>
<script>
var DEF=[{"n": "SIN MATRÍCULA · Matadero · Cuadras · Acceso a cuadras", "p": "CS1", "b": ""}, {"n": "LAV-507 · Matadero · Zona sucia · Taller mantenimiento", "p": "CS1", "b": "Venturi"}, {"n": "SIN MATRÍCULA · Matadero · Zona sucia · Salida taller subcontrata", "p": "CS1", "b": "Bomba"}, {"n": "LAV-505 · Matadero · Zona sucia · Salida de producción", "p": "CS1", "b": "Bomba"}, {"n": "LAV-508 · Matadero · Zona sucia · Entrada a producción", "p": "CS1", "b": "Venturi"}, {"n": "DDM-500 · Matadero · Zona sucia · Entrada a producción-desinfectador manos", "p": "CS1", "b": ""}, {"n": "LAV-506 · Matadero · Zona limpia · Salida de producción", "p": "CS1", "b": "Bomba"}, {"n": "SIN MATRÍCULA · Matadero · Zona limpia · Entrada a producción", "p": "CS1", "b": "Venturi"}, {"n": "DDM-501 · Matadero · Zona limpia · Entrada a producción-desinfectador manos", "p": "CS1", "b": ""}, {"n": "SIN MATRÍCULA · Matadero · Zona limpia · Salida laboratorio", "p": "CS1", "b": "Venturi"}, {"n": "SIN MATRÍCULA · Matadero · Sala cabezas · Acceso producción (sección cabezas)", "p": "CS1", "b": "Venturi"}, {"n": "LAV-502 · Matadero · Sala cabezas · Salida de producción", "p": "CS1", "b": "Bomba"}, {"n": "DDM-503 · Matadero · Sala cabezas · Desinfectador manos", "p": "CS1", "b": ""}, {"n": "SIN MATRÍCULA · Matadero · Tripería · Acceso producción", "p": "CS1", "b": "Venturi"}, {"n": "LAV-500 · Matadero · Tripería · Salida de producción", "p": "CS1", "b": "Bomba"}, {"n": "DDM-502 · Matadero · Tripería · Desinfectador manos", "p": "CS1", "b": ""}, {"n": "LAV-509 · Matadero · Empaquetado matadero · Acceso producción", "p": "CS1", "b": "Venturi"}, {"n": "LVB-125 · Pasillo visitas · Lado matadero · Entrada matadero", "p": "CS1", "b": "Venturi"}, {"n": "LVB-125 · Pasillo visitas · Lado matadero · Salida matadero", "p": "CS1", "b": "Venturi"}, {"n": "LVB-126 · Pasillo visitas · Lado despiece · Entrada despiece", "p": "CS1", "b": "Venturi"}, {"n": "LVB-126 · Pasillo visitas · Lado despiece · Salida despiece", "p": "CS1", "b": "Venturi"}, {"n": "LVB-130 · Despiece · Entrada a producción · Lado derecho", "p": "CS1", "b": "Venturi"}, {"n": "LVB-129 · Despiece · Entrada a producción · Lado izquierdo", "p": "CS1", "b": "Venturi"}, {"n": "LAV-103 · Despiece · Salida de producción · Lado derecho", "p": "CS1", "b": "Bomba"}, {"n": "LAV-102 · Despiece · Salida de producción · Lado izquierdo", "p": "CS1", "b": "Bomba"}, {"n": "LAV-105 · Despiece · Sala dacor · Acceso cuarto de afilado", "p": "CS1", "b": ""}, {"n": "LAV-201 · Adobos · Entrada a producción · Acceso a producción/cafetería", "p": "CS1", "b": "Venturi"}, {"n": "LAV-200 · Fileteado exportación · Entrada a producción · Acceso a producción", "p": "CS1", "b": "Bomba"}, {"n":"Profilgate 1 · Hacia zona limpia","p":"CS1","k":"CS1P","b":"Bomba"},{"n":"Profilgate 2 · Hacia zona sucia","p":"CS1","k":"CS1P","b":"Bomba"},{"n": "LAV600 · Expediciones · Expediciones · Entrada/salida expediciones", "p": "CS3", "b": ""}, {"n": "LAV601 · Envasado · Cámara materia prima · Entrada/salida producción (vestuarios)", "p": "CS3", "b": ""}, {"n": "LAV602 · Envasado · Cámara materia prima · Entrada/salida producción (oficina)", "p": "CS3", "b": ""}];
var PL0={CS1:{prod:"Divosan Extra",uni:"ppm QUAC",min:25,max:250},CS1P:{prod:"Divosan 2010",uni:"% p/p",min:0.5,max:null},CS3:{prod:"Divosan 2010",uni:"% p/p",min:0.5,max:null}};
var S={cfg:{pl:JSON.parse(JSON.stringify(PL0)),vados:DEF.map(function(v){return {n:v.n,p:v.p,k:v.k,b:v.b,min:null,max:null}})},rev:null};
function ld(){try{var c=localStorage.getItem("vados_cfg3");if(c)S.cfg=JSON.parse(c);var r=localStorage.getItem("vados_rev3");if(r)S.rev=JSON.parse(r);var q=S.cfg.pl&&S.cfg.pl.CS1;if(q&&q.min==null&&q.max==null){q.min=25;q.max=250}}catch(e){}}
function sv(){try{localStorage.setItem("vados_cfg3",JSON.stringify(S.cfg));localStorage.setItem("vados_rev3",JSON.stringify(S.rev))}catch(e){}}
function hora(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
function hoy(){var d=new Date();return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear()}
function pl(v){return S.cfg.pl[v.k||v.p]||{prod:"",uni:"",min:null,max:null}}
function nueva(){S.rev={ini:hora(),fecha:hoy(),fin:null,d:{}};S.cfg.vados.forEach(function(v){S.rev.d[v.n]={dos:null,con:"",nota:"",gar:0,vad:0,ri:0,rd:0}});sv();draw();LM();document.getElementById("res").classList.add("hide")}
function rango(v){var p=pl(v);return [v.min!=null?v.min:p.min,v.max!=null?v.max:p.max]}
function estado(v){var x=S.rev.d[v.n],r=rango(v);if(x.con===""||x.con==null)return null;var c=parseFloat(String(x.con).replace(",","."));if(isNaN(c))return null;if(r[0]==null&&r[1]==null)return "sin rango";if(r[0]!=null&&c<r[0])return "BAJA";if(r[1]!=null&&c>r[1])return "ALTA";return "OK"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){
  document.getElementById("fecha").textContent=S.rev?S.rev.fecha:hoy();
  document.getElementById("hIni").textContent=S.rev?S.rev.ini:"—";
  var L=document.getElementById("lista");L.innerHTML="";
  if(!S.cfg.vados.length){L.innerHTML='<div class="card">Aún no hay vados. Pulsa ⚙️.</div>';return}
  S.cfg.vados.forEach(function(v,i){
    var x=S.rev.d[v.n]||(S.rev.d[v.n]={dos:null,con:"",nota:"",gar:0,vad:0,ri:0,rd:0}),e=estado(v),r=rango(v),p=pl(v);
    if(i===0||(S.cfg.vados[i-1].k||S.cfg.vados[i-1].p)!==(v.k||v.p))L.insertAdjacentHTML("beforeend",'<h1>'+esc(v.p)+' · '+esc(p.prod)+'</h1>');
    var cl=e==="OK"?"ok":(e==="BAJA"||e==="ALTA")?"mal":"nd";
    var rt=(r[0]!=null||r[1]!=null)?("Correcto: "+(r[0]!=null?r[0]:"–")+" a "+(r[1]!=null?r[1]:"–")+" "+p.uni):"Rango sin definir";
    var fa=falta(x);
    var h='<div class="card" id="v'+i+'"><b>'+(i+1)+". "+esc(v.n)+'</b> <span class="badge '+cl+'">'+(e||"pendiente")+'</span>'+(fa?'<span class="fal">faltan '+fa+'</span>':'')+
    '<div class="small">'+(v.b?'Dosificación: '+esc(v.b)+' · ':'')+esc(rt)+'</div>'+
    '<label>¿Dosifica producto?</label><div class="row">'+
    '<button class="'+(x.dos===true?"sel-si":"sec")+'" onclick="dos('+i+',true)">Sí</button>'+
    '<button class="'+(x.dos===false?"sel-no":"sec")+'" onclick="dos('+i+',false)">No</button></div>'+
    (usaCol(v)?colHTML(i,x,p):'<label>Concentración ('+esc(p.uni)+')</label><input class="n" type="number" inputmode="decimal" value="'+esc(x.con)+'" oninput="con('+i+',this.value)" onchange="draw()">')+
    '<div class="sep"></div>'+
    '<div class="f"><span>Garrafa</span>'+bt(i,"gar",1,"Llena","v",x)+bt(i,"gar",2,"Media","n",x)+bt(i,"gar",3,"Vacía","x",x)+'</div>'+
    '<div class="f"><span>Vado</span>'+bt(i,"vad",1,"Limpio","v",x)+bt(i,"vad",2,"Sucio","x",x)+'</div>'+
    '<label style="margin-top:10px">Rodillos (toca para cambiar)</label><div class="row" style="flex-wrap:nowrap">'+rb(i,"ri","Izquierdo",x)+rb(i,"rd","Derecho",x)+'</div>'+rm(i,"ri","izquierdo",x)+rm(i,"rd","derecho",x)+sapBlock(i,x)+
    '<label>Nota (opcional)</label><input value="'+esc(x.nota)+'" oninput="nota('+i+',this.value)"></div>';
    L.insertAdjacentHTML("beforeend",h)});
}
function bt(i,k,v,t,c,x){return '<button class="p'+(x[k]===v?' '+c:'')+'" onclick="est('+i+',\''+k+'\','+v+')">'+t+'</button>'}
function rb(i,k,t,x){var s=x[k]||0;return '<button class="rod'+(s===1?' v':s===2?' x':'')+'" onclick="rod('+i+',\''+k+'\')">'+t+'<br><b>'+(s===1?'Bien':s===2?'Mal':'—')+'</b></button>'}
function est(i,k,v){var x=S.rev.d[S.cfg.vados[i].n];x[k]=(x[k]===v)?0:v;sv();draw()}
function rod(i,k){var x=S.rev.d[S.cfg.vados[i].n];x[k]=((x[k]||0)+1)%3;if(x[k]!==2){x[k+"m"]=0}sv();draw()}
function rm(i,k,t,x){if(x[k]!==2)return '';var m=x[k+"m"]||0;
  return '<div style="margin-top:8px;padding:10px;border-radius:12px;background:#fef2f2"><div style="font-size:14px;color:#7f1d1d;font-weight:500">Rodillo '+t+': ¿por qué está mal?</div><div class="row" style="flex-wrap:nowrap;margin-top:6px"><button class="p'+(m===1?' x':'')+'" onclick="rmot('+i+',\''+k+'\',1)">Desgaste</button><button class="p'+(m===2?' x':'')+'" onclick="rmot('+i+',\''+k+'\',2)">No gira</button></div></div>'}
function sapBlock(i,x){var n=[];if(x.dos===false)n.push("no dosifica");var e=estado(S.cfg.vados[i]);if(e==="BAJA")n.push("dosifica por debajo de lo recomendado");if(e==="ALTA")n.push("dosifica por encima de lo recomendado");if(x.ri===2)n.push("rodillo izquierdo");if(x.rd===2)n.push("rodillo derecho");if(!n.length)return '';
  return '<div style="margin-top:10px;padding:10px;border-radius:12px;background:#fff7ed;border:1px solid #fdba74"><div style="font-size:15px;color:#9a3412;font-weight:500">Aviso de mantenimiento (SAP)</div><div class="small" style="margin:2px 0 6px">Para: '+n.join(" · ")+'</div><input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Nº de aviso (solo números)" value="'+esc(x.sap||"")+'" oninput="sap('+i+',this)"><div class="small" style="margin-top:4px">Si aún no lo has creado, déjalo vacío: saldrá como aviso pendiente.</div></div>'}
function rmot(i,k,m){var x=S.rev.d[S.cfg.vados[i].n];x[k+"m"]=(x[k+"m"]===m)?0:m;sv();draw()}
function pend(){var r=[];S.cfg.vados.forEach(function(v,i){var x=S.rev.d[v.n];if(x&&falta(x))r.push(i)});return r}
function dlg(pn){var fl=0;pn.forEach(function(i){fl+=falta(S.rev.d[S.cfg.vados[i].n])});
  var e=document.getElementById("dlg");e.classList.remove("hide");
  e.innerHTML='<div><b style="font-size:19px">Faltan datos</b><p style="margin:8px 0 14px;color:#475569">Quedan '+fl+' datos sin marcar en '+pn.length+' vados (dosificación, garrafa, vado, rodillos o motivo).</p><button style="width:100%;margin-bottom:8px" onclick="verPend()">Ver pendientes</button><button class="sec" style="width:100%" onclick="cerrarDlg();fin(true)">Finalizar igualmente</button></div>'}
function cerrarDlg(){var e=document.getElementById("dlg");e.classList.add("hide");e.innerHTML=""}
function verPend(){cerrarDlg();var pn=pend();if(!pn.length)return;var c=document.getElementById("v"+pn[0]);if(!c)return;c.scrollIntoView({block:"start",behavior:"smooth"});c.classList.add("flash");setTimeout(function(){c.classList.remove("flash")},2500)}
function falta(x){return (x.dos===null?1:0)+(x.gar?0:1)+(x.vad?0:1)+(x.ri?0:1)+(x.rd?0:1)+(x.ri===2&&!x.rim?1:0)+(x.rd===2&&!x.rdm?1:0)}
var COL=[[0,"#ffef7a"],[10,"#fce36c"],[25,"#d4d16e"],[50,"#a4ba86"],[100,"#82af8d"],[250,"#539f9f"],[500,"#3c92a6"],[1000,"#3a98b1"]];
function usaCol(v){return (pl(v).prod||"").toLowerCase().indexOf("extra")>-1}
function colHTML(i,x,p){var s='<label>Compara la tira con la pantalla (mg/L)</label><div style="display:flex;justify-content:space-between;gap:2px;background:#f8fafc;padding:8px 4px 6px;border-radius:14px;border:1px solid #e2e8f0">';
  COL.forEach(function(c){var on=String(x.con)===String(c[0]);s+='<button onclick="colSel('+i+','+c[0]+')" style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;background:none;color:#334155"><span style="width:34px;height:34px;border-radius:50%;background:'+c[1]+';box-shadow:'+(on?'0 0 0 3px #fff,0 0 0 5px #1d4ed8':'inset 0 0 0 1px #0000001f')+'"></span><span style="font-size:12px;font-weight:'+(on?'700':'500')+';color:'+(on?'#1d4ed8':'#334155')+'">'+c[0]+'</span></button>'});
  return s+'</div><div class="small" style="margin-top:6px">'+(x.con!==""?'Elegido: '+esc(x.con)+' '+esc(p.uni):'Brillo al máximo y sin modo nocturno')+'</div>'}
function colSel(i,v){var x=S.rev.d[S.cfg.vados[i].n];x.con=(String(x.con)===String(v))?"":String(v);sv();draw()}
function dos(i,b){S.rev.d[S.cfg.vados[i].n].dos=b;sv();draw()}
function sap(i,el){var v=el.value.replace(/[^0-9]/g,'');if(v!==el.value)el.value=v;S.rev.d[S.cfg.vados[i].n].sap=v;sv()}
function con(i,val){S.rev.d[S.cfg.vados[i].n].con=val;sv()}
function nota(i,val){S.rev.d[S.cfg.vados[i].n].nota=val;sv()}
function stats(){var n=S.cfg.vados.length,si=0,no=0,fu=0,pen=0,gv=0,su=0,rm=0,fl=0;S.cfg.vados.forEach(function(v){var x=S.rev.d[v.n],e=estado(v);if(x.gar===3)gv++;if(x.vad===2)su++;if(x.ri===2)rm++;if(x.rd===2)rm++;fl+=falta(x);if(x.dos===true)si++;if(x.dos===false)no++;if(e==="BAJA"||e==="ALTA")fu++;if(x.dos===null&&x.con==="")pen++});return {n:n,si:si,no:no,fu:fu,pen:pen,gv:gv,su:su,rm:rm,fl:fl}}
function setRev(v){S.cfg.revisor=v;var e=document.getElementById("revisor");e.style.borderColor="";sv()}
function fin(force){var rv=document.getElementById("revisor");if(!(S.cfg.revisor||"").trim()){rv.style.borderColor="#b91c1c";rv.placeholder="Escribe tu nombre para terminar";rv.focus();rv.scrollIntoView();return}
  var pn=pend();if(pn.length&&force!==true){dlg(pn);return}
  S.rev.fin=hora();sv();var t=stats();
  document.getElementById("resTxt").innerHTML="Fin: "+S.rev.fin+" · "+t.n+" vados<br>Dosifican: "+t.si+" · No dosifican: "+t.no+" · Fuera de rango: "+t.fu+" · Sin revisar: "+t.pen+"<br>Garrafas vacías: "+t.gv+" · Vados sucios: "+t.su+" · Rodillos mal: "+t.rm;
  document.getElementById("pdfMsg").textContent="";LM();document.getElementById("pend").innerHTML=pend().length?'<button class="sec" onclick="verPend()" style="width:100%">Ver pendientes ('+pend().length+' vados)</button>':'';document.getElementById("res").classList.remove("hide");document.getElementById("res").scrollIntoView()}
async function hacerPdf(){
  var P=window.PDFLib;if(!P)return null;
  var doc=await P.PDFDocument.create();
  var F=await doc.embedFont(P.StandardFonts.Helvetica),B=await doc.embedFont(P.StandardFonts.HelveticaBold);
  var W=595.28,H=841.89,M=36,BOT=50,page,y;
  function C(h){return P.rgb(parseInt(h.substr(1,2),16)/255,parseInt(h.substr(3,2),16)/255,parseInt(h.substr(5,2),16)/255)}
  var nh=false,cx={n:M+4,v:M+20,d:M+162,s:M+208,m:M+248,e:M+298,g:M+358,vd:M+404,r:M+454};
  function np(){page=doc.addPage([W,H]);y=H-M;nh=true}
  function hdr(){[["Nº",cx.n],["Vado",cx.v],["Dosificación",cx.d],["¿Dosifica?",cx.s],["Medida",cx.m],["Estado",cx.e],["Garrafa",cx.g],["Vado",cx.vd],["Rodillos",cx.r]].forEach(function(h){tx(h[0],h[1],y-9,7.5,B,"#64748b")});y-=16;nh=false}
  function tx(t,x,yy,sz,f,col){page.drawText(String(t),{x:x,y:yy,size:sz,font:f||F,color:C(col||"#1a1d21")})}
